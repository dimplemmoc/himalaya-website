<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Live Local Himalaya</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/blog-details.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="blog-detail">
        <div class="blog-detail-hero">
            <img id="article-image" alt="" hidden>
            <div class="hero-overlay"></div>

            <div class="hero-content">
                <span id="article-category"></span>
                <h1 id="article-title">Loading article...</h1>
                <p id="article-meta"></p>
            </div>
        </div>

        <article class="article-content">
            <a href="blog.html" class="back-link">← Back to Blogs</a>
            <div id="article-body"></div>
        </article>
    </main>

    <div id="footer-container"></div>

    <script src="js/components.js"></script>
<script src="js/site.js" defer></script>
    <script src="js/blog-details.js"></script>
</body>
</html>
