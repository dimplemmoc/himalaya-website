 <g transform="translate(682 244)"><rect width="165" height="137" rx="20" fill="#fffbef" stroke="#f5d993"/><text x="23" y="53" class="sans" font-size="33" font-weight="800" fill="#d47c08">95+</text><text x="23" y="80" class="sans" font-size="13" font-weight="700" fill="#35415a">PageSpeed</text><text x="23" y="105" class="sans tiny">Core Web Vitals</text></g>
 <text x="500" y="425" class="sans" font-size="13" font-weight="700" fill="#59657c">Proof that compounds</text><path d="M500 447h347" stroke="#edf0f5"/><path d="M510 486c42-45 74 1 111-30s61 9 96-17 73 15 121-37" fill="none" stroke="#5979df" stroke-width="4"/><path d="M510 495c40-13 70-7 108-22s70-2 106-22 68-10 114-32" fill="none" stroke="#e6b251" stroke-width="2" opacity=".8"/>
</g>
