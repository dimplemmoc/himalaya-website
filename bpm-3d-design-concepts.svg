<text x="82" y="76" class="sans" font-size="14" font-weight="700" letter-spacing="3" fill="#7d8798">BALAJI PRIME MEDIA · VISUAL CONCEPT</text>
<text x="82" y="132" class="sans" font-size="39" font-weight="750" fill="#101a31">A sharper, more dimensional BPM</text>
<text x="83" y="166" class="sans" font-size="17" fill="#66728a">Three directions for bringing the current clean interface into 3D.</text>
