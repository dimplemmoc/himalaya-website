 <text x="112" y="109" class="sans" font-size="14" font-weight="800" fill="#17223e">BPM</text><text x="112" y="126" class="sans" font-size="9" letter-spacing="1.4" fill="#8a91a0">BALAJI PRIME MEDIA</text>
 <rect x="44" y="172" width="116" height="25" rx="12" fill="#fff8e7" stroke="#f2d695"/><text x="59" y="189" class="sans label">OUR PURPOSE</text>
 <text x="44" y="246" class="sans" font-size="32" font-weight="750" fill="#111a30">We help businesses win</text><text x="44" y="283" class="sans" font-size="32" font-weight="750" fill="#111a30">in competitive search.</text>
 <text x="44" y="326" class="sans" font-size="15" fill="#69758b">Ethical digital marketing, built on measurable</text><text x="44" y="350" class="sans" font-size="15" fill="#69758b">growth, deep engineering, and human outreach.</text>
 <rect x="44" y="390" width="146" height="46" rx="23" fill="url(#navy)"/><text x="66" y="418" class="sans" font-size="13" font-weight="700" fill="#fff">Explore our work</text><path d="M169 407l8 7-8 7" fill="none" stroke="#efc66d" stroke-width="2"/>
