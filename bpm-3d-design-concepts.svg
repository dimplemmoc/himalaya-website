<g transform="translate(90 920)"><rect width="690" height="125" rx="22" fill="#111a31"/><text x="26" y="37" class="sans" font-size="12" letter-spacing="2" font-weight="700" fill="#dfb657">02 · BRAND OBJECT</text><text x="26" y="72" class="sans" font-size="21" font-weight="750" fill="#fff">A sculpted BPM monogram</text><text x="26" y="98" class="sans" font-size="13" fill="#bbc5d8">Obsidian body · champagne metal · restrained glow</text><g transform="translate(500 16)"><path d="M80 8l63 34v53l-63 36-64-36V42z" fill="#080d1b" stroke="#c49a50" stroke-width="2"/><path d="M80 8l63 34-63 34-64-34z" fill="#26314c"/><text x="44" y="79" class="sans" font-size="22" font-weight="800" fill="#f6dc95">BPM</text></g></g>
<g transform="translate(820 920)"><rect width="690" height="125" rx="22" fill="#fff" stroke="#e1e6ee"/><text x="26" y="37" class="sans label">03 · PERFORMANCE CARD</text><text x="26" y="72" class="sans" font-size="21" font-weight="750" fill="#18233b">Campaign results, made tangible</text><text x="26" y="98" class="sans" font-size="13" fill="#6b778d">Layered chart card · clean data · a quiet gold accent</text><g transform="translate(500 17)"><rect width="155" height="91" rx="14" fill="#f7f9fc" stroke="#e6ebf3"/><text x="13" y="23" class="sans tiny">VISIBILITY</text><text x="13" y="52" class="sans" font-size="24" font-weight="800" fill="#1b2c50">+42.8%</text><path d="M13 75l24-12 21 7 25-23 20 11 25-21" fill="none" stroke="#5574d5" stroke-width="3"/></g></g>
